name: ASP.NET Live Backend

on:
  push:
    paths:
      - 'aspnet-live/**'
      - '.github/workflows/aspnet-live.yml'
  pull_request:
    paths:
      - 'aspnet-live/**'
      - '.github/workflows/aspnet-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aspnet-postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: group6_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d group6_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: 'Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=group6_ci;SSL Mode=Disable'
      ASPNETCORE_URLS: 'http://127.0.0.1:5060'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup supported .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore backend and xUnit tests
        run: dotnet restore aspnet-live/Group6Live.Tests/Group6Live.Tests.csproj
      - name: Build backend
        run: dotnet build aspnet-live/Group6Live/Group6Live.csproj -c Release --no-restore -warnaserror
      - name: Run xUnit boundary tests
        run: dotnet test aspnet-live/Group6Live.Tests/Group6Live.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=aspnet-tests.trx"
      - name: ASP.NET plus real PostgreSQL integration / SSE / restart persistence
        run: python3 aspnet-live/e2e_integration.py
      - name: Docker image builds for Render
        run: docker build -f aspnet-live/Group6Live/Dockerfile -t group6-aspnet-live:test aspnet-live/Group6Live
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnet-postgres-ci-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            **/TestResults/*.trx
            aspnet-live/e2e-result.json
            aspnet-live/e2e-server.log
