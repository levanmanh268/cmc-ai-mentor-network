name: Python dependency audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install repository test/runtime dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install pip-audit
        run: python -m pip install --upgrade "pip>=26.2" pip-audit

      - name: Audit declared test and runtime dependencies
        run: |
          mkdir -p reports
          python -m pip_audit --local --strict --format json --output reports/pip-audit.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-${{ github.sha }}
          path: reports/pip-audit.json
          if-no-files-found: warn
          retention-days: 30
