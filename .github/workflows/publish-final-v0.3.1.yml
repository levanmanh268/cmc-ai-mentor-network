name: Publish Final Defense v0.3.1

# This privileged workflow only uses the successful CI SHA from the trusted main push.
# Never execute untrusted PR code or checkout arbitrary PR head branches.
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

permissions:
  contents: read

jobs:
  publish-defense-v031:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cmc-ai-mentor-v031-release
      cancel-in-progress: false
    steps:
      - name: Checkout exact green main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify trusted SHA, deployed cloud HTTP, and publish pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_CI: ${{ github.event.workflow_run.html_url }}
          TAG: v0.3.1
          DEPLOYED_URL: https://cmc-ai-mentor-network-group6.onrender.com
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "FAIL: checkout does not match CI-verified commit."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Already released $TAG. Immutable version maintained."
            exit 0
          fi
          CURRENT_MAIN="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_MAIN" != "$EXPECTED_SHA" ]]; then
            echo "Skip stale success event; wait for main HEAD CI."
            exit 0
          fi

          # Free-tier cold start and freshly-deploying revisions may be slow.
          # Fail closed if the public cloud endpoint never passes these checks.
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 20 \
            --retry 24 --retry-delay 10 --retry-all-errors \
            "$DEPLOYED_URL/_stcore/health" -o "$RUNNER_TEMP/health.txt"
          if ! grep -qx 'ok' "$RUNNER_TEMP/health.txt"; then
            echo "FAIL: invalid Streamlit health response."
            cat "$RUNNER_TEMP/health.txt"
            exit 1
          fi
          curl --fail --show-error --silent \
            --connect-timeout 10 --max-time 20 \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "$DEPLOYED_URL/" -o "$RUNNER_TEMP/index.html"
          if ! grep -qi "streamlit" "$RUNNER_TEMP/index.html"; then
            echo "FAIL: expected Streamlit HTML shell was not found."
            exit 1
          fi

          # Prevent publishing a wrong or previously hijacked tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent >/dev/null 2>&1; then
            echo "FAIL: release tag exists without a published release."
            exit 1
          fi
          NOTES="$RUNNER_TEMP/v031-release.md"
          cp docs/RELEASE_NOTES_v0.3.1.md "$NOTES"
          printf '\n\n### Verified publication evidence\n\n' >> "$NOTES"
          printf -- '- CI (green, exact commit): %s\n' "$VERIFIED_CI" >> "$NOTES"
          printf -- '- Commit: [`%s`](https://github.com/%s/commit/%s)\n' "$EXPECTED_SHA" "$GITHUB_REPOSITORY" "$EXPECTED_SHA" >> "$NOTES"
          printf -- '- Public Streamlit health: %s/_stcore/health returned HTTP 200 with body `ok`.\n' "$DEPLOYED_URL" >> "$NOTES"
          printf -- '- Public UI root: %s returned HTTP 200 with Streamlit HTML shell.\n' "$DEPLOYED_URL" >> "$NOTES"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_SHA" \
            --title "v0.3.1 | Final Defense Readiness" \
            --notes-file "$NOTES" \
            --prerelease
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
          [[ "$TAG_SHA" == "$EXPECTED_SHA" ]] || { echo "FAIL: tag mismatch"; exit 1; }
          echo "PASS: release $TAG at trusted SHA; cloud health and root HTML were checked."
