name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Secret guard
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----' -- .; then
            echo "Potential credential detected in tracked files."
            exit 1
          fi
          echo "No tracked secret pattern detected."

      - name: Compile smoke check
        run: |
          python -m py_compile general_chat.py chat_intents.py app.py ui_helpers.py profile_helpers.py llm_client.py rag_engine.py matching_engine.py mentors_data.py mentor_data_diagnostics.py ingest.py scripts/evaluate_rag.py scripts/final_smoke_audit.py

      - name: Run regression tests
        env:
          GROQ_API_KEY: ""
        run: |
          mkdir -p reports
          python -m pytest -q -rs --junitxml=reports/junit-linux.xml \
            --cov=general_chat --cov=rag_engine --cov=matching_engine \
            --cov=profile_helpers --cov=llm_client --cov=chat_intents \
            --cov=ui_helpers --cov-report=term-missing --cov-report=xml:reports/coverage.xml

      - name: Generate testing evidence report
        if: always()
        run: |
          python -m scripts.testing_report \
            --junit reports/junit-linux.xml \
            --coverage reports/coverage.xml \
            --output reports/TEST_EXECUTION_REPORT.md

      - name: Upload test evidence (JUnit, coverage, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-evidence-linux
          path: |
            reports/junit-linux.xml
            reports/coverage.xml
            reports/TEST_EXECUTION_REPORT.md
          if-no-files-found: warn
          retention-days: 30

      - name: Offline mentor diagnostic and RAG evaluation
        env:
          GROQ_API_KEY: ""
        run: |
          python mentor_data_diagnostics.py
          python -m scripts.evaluate_rag
          python -m scripts.final_smoke_audit

      - name: Streamlit runtime smoke test
        env:
          GROQ_API_KEY: ""
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py             --server.headless true             --server.address 127.0.0.1             --server.port 8501             > /tmp/streamlit.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -qi "ok"; then
              echo "Streamlit health check passed."
              exit 0
            fi
            sleep 1
          done

          echo "Streamlit did not become healthy."
          cat /tmp/streamlit.log
          exit 1

  windows-local:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Windows unit and UI tests
        env:
          GROQ_API_KEY: ""
        run: python -m pytest -q -rs --junitxml=reports/junit-windows.xml

      - name: Upload Windows JUnit regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-evidence-windows
          path: reports/junit-windows.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Windows Streamlit HTTP startup
        env:
          GROQ_API_KEY: ""
        shell: pwsh
        run: |
          $stdOut = Join-Path $env:RUNNER_TEMP "streamlit.stdout.log"
          $stdErr = Join-Path $env:RUNNER_TEMP "streamlit.stderr.log"
          $process = Start-Process -FilePath "python" -ArgumentList @(
            "-m", "streamlit", "run", "app.py",
            "--server.headless", "true",
            "--server.address", "127.0.0.1",
            "--server.port", "8501"
          ) -PassThru -RedirectStandardOutput $stdOut -RedirectStandardError $stdErr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $healthy = $true
                  break
                }
              } catch {
                # Keep polling during startup.
              }
              if ($process.HasExited) { break }
            }
            if (-not $healthy) {
              Write-Output "Streamlit stdout:"
              Get-Content $stdOut -ErrorAction SilentlyContinue
              Write-Output "Streamlit stderr:"
              Get-Content $stdErr -ErrorAction SilentlyContinue
              throw "Windows Streamlit startup/health check failed."
            }
            Write-Output "Windows Streamlit health check passed."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

  mermaid-render:
    name: Render Mermaid with CLI ${{ matrix.mermaid_cli }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mermaid_cli: ["10.9.1", "11.17.0"]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install pinned Mermaid CLI
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          for attempt in 1 2 3; do
            if npm install --no-save --no-package-lock --no-audit --no-fund @mermaid-js/mermaid-cli@${{ matrix.mermaid_cli }}; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Mermaid npm install failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Validate and render all Mermaid fences to SVG
        run: node scripts/validate_mermaid.mjs

  browser-e2e:
    name: Chromium browser E2E (real localhost UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-playwright>=0.6,<1"

      - name: Install Chromium with system libraries
        run: python -m playwright install --with-deps chromium

      - name: Execute browser end-to-end smoke
        run: |
          mkdir -p reports
          python -m pytest -q e2e/browser_spec.py \
            --browser chromium \
            --junitxml=reports/junit-browser.xml \
            --screenshot=only-on-failure \
            --tracing=retain-on-failure

      - name: Upload browser evidence (JUnit, screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-evidence-chromium
          path: |
            reports/junit-browser.xml
            test-results/
          if-no-files-found: warn
          retention-days: 30
